# Ruff settings for Python code blocks inside skill docs: the same house rules as real projects.
# Only rules a snippet cannot satisfy by its nature are off; test examples get the same per-file
# exemptions as the tests/ directory of a house repo (check_examples.py writes them under tests/).
line-length = 100
target-version = "py314"

[lint]
select = ["ALL"]
ignore = [
    # House defaults
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright headers
    "D203",    # Google convention
    "D213",    # Google convention
    # A snippet is a fragment of a module, not a module
    "D100",    # module docstring
    "INP001",  # not part of a package
    "F821",    # names defined in the surrounding prose or elsewhere in the module
    "F704",    # await or yield shown outside its function
    "F706",    # return shown outside its function
    "PLE1142", # await shown outside its async function
]

[lint.per-file-ignores]
"**/tests/**" = [
    "S101",    # assert is the point of tests
    "PLR2004", # magic numbers in expectations are fine
    "D",       # test names document themselves
]

[lint.pydocstyle]
convention = "google"
