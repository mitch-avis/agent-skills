# Ruff settings for Python code blocks inside skill docs. Same house rules as real projects, minus
# the ones that only fire because a snippet is a fragment (undefined names, missing docstrings,
# placeholder bodies, unused imports shown for illustration).
line-length = 100
target-version = "py314"

[lint]
select = ["ALL"]
ignore = [
    "ANN",     # fragments often omit annotations on illustrative helpers
    "ARG",     # placeholder parameters
    "B018",    # bare expressions used to show a value
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright headers in snippets
    "D",       # docstrings are not the point of a snippet
    "E402",    # imports shown next to the code that uses them
    "ERA001",  # commented-out alternatives are deliberate
    "F401",    # imports shown for illustration
    "F811",    # the same name redefined across "before" and "after" variants
    "F821",    # names defined elsewhere in the surrounding prose
    "F704",    # await or yield shown outside its function
    "F706",    # return shown outside its function
    "F841",    # values assigned only to show the call
    "I001",    # import order is the formatter's job, not the example's
    "INP001",  # snippets are not packages
    "PIE790",  # `...` placeholder bodies
    "PLE1142", # await shown outside its async function
    "PLR2004", # literal values in examples
    "RET504",  # assign-then-return kept for readability
    "S101",    # assert in test examples
    "S311",    # random in examples is not cryptographic
    "T201",    # print in examples
    "TC",      # TYPE_CHECKING placement depends on the surrounding module
]
