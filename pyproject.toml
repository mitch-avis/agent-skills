[project]
name = "agent-skills-tools"
version = "0.1.0"
description = "Repository tooling for the agent skills collection"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-html>=4.2",
    "pytest-metadata>=3.1",
    "pytest-sugar>=1.1",
    "pytest-xdist>=3.8",
    "ruff>=0.17",
    "ty>=0.0.86",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"
# The repo's tooling and standalone example modules in skill references. Code blocks inside
# Markdown are checked by scripts/check_examples.py.
include = [
    "scripts/**/*.py",
    "tests/**/*.py",
    "*/references/**/*.py",
    "pyproject.toml",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "INP001", # standalone scripts, not a package
]
"scripts/check_examples.py" = [
    "S603", # argv is built from fixed tool paths and its own temp files, never from input
    "T201", # a CLI reports its findings on stdout
]
"*/references/**" = [
    "INP001", # standalone example modules shipped with a skill, not a package
]
"tests/**" = [
    "S101",    # assert is the point of tests
    "PLR2004", # magic numbers in expectations are fine
    "D",       # test names document themselves
    "INP001",  # pytest rootdir-relative tests, not a package
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["scripts", "tests"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python = ".venv"
extra-paths = ["scripts"]

[tool.ty.src]
include = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
fail_under = 90
show_missing = true
