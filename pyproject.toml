[project]
name = "agent-skills-tools"
version = "0.1.0"
description = "Repository tooling for the agent skills collection"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-metadata>=3.1.1",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"
# The repo's own tooling only, matching pyright and ty. Skill payloads (skill-creator's scripts,
# reference examples, code blocks in Markdown) are checked by scripts/check_examples.py instead.
include = ["scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "INP001", # standalone scripts, not a package
]
"tests/**" = [
    "S101",    # assert is the point of tests
    "PLR2004", # magic numbers in expectations are fine
    "D",       # test names document themselves
    "INP001",  # pytest rootdir-relative tests, not a package
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["scripts", "tests"]
extraPaths = ["scripts"]
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python = ".venv"
extra-paths = ["scripts"]

[tool.ty.src]
include = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
fail_under = 90
show_missing = true
